<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>LiveGFX · Tabellone squadre</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="themes.css">
<style>
  #sb { position: absolute; top: 44px; left: 0; right: 0; margin: 0 auto; width: max-content; display: flex; flex-direction: column; align-items: center; }
  .title { font: 700 20px var(--font-display); letter-spacing: .22em; text-transform: uppercase; color: var(--text);
    background: var(--panel); padding: 6px 18px; border-radius: var(--radius) var(--radius) 0 0; }
  .teams { display: flex; background: var(--panel); border-radius: var(--radius); overflow: hidden; }
  .team { display: flex; align-items: stretch; }
  .team + .team { border-left: 1px solid var(--line); }
  .tname { display: flex; align-items: center; padding: 0 22px; font: 700 28px var(--font-display); text-transform: uppercase;
    white-space: nowrap; border-bottom: 4px solid var(--c); }
  .tscore { display: flex; align-items: center; justify-content: center; min-width: 104px; padding: 10px 18px;
    font: 700 54px var(--font-display); color: var(--text-on-accent); background: var(--c); position: relative; }
  [data-theme="neon"] .tscore { box-shadow: 0 0 26px var(--c-glow); }
  .team.right { flex-direction: row-reverse; }
  .burst { position: absolute; inset: -6px; border: 3px solid var(--c); border-radius: var(--radius); opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="sb" class="hidden-init">
  <div class="title" id="title"></div>
  <div class="teams neon-edge" id="teams"></div>
</div>
<script src="../vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
const sb = document.getElementById('sb');
const teamsEl = document.getElementById('teams');
let visible = false;
let structKey = '';
const shown = {};   // id -> punteggio mostrato

function build(teams) {
  teamsEl.innerHTML = teams.map((t, i) => {
    // Con 2 squadre il punteggio sta al centro, "faccia a faccia"
    const right = teams.length === 2 && i === 1;
    return `<div class="team c-${t.color}${right ? ' right' : ''}" data-id="${t.id}">
      <div class="tname">${LiveGFX.esc(t.name)}</div>
      <div class="tscore num"><span class="v">${t.score}</span><div class="burst"></div></div></div>`;
  }).join('');
  teams.forEach((t) => { shown[t.id] = t.score; });
}

function update(teams) {
  for (const t of teams) {
    const el = teamsEl.querySelector(`[data-id="${t.id}"]`);
    if (!el || shown[t.id] === t.score) continue;
    const v = el.querySelector('.v');
    const o = { n: shown[t.id] };
    shown[t.id] = t.score;
    gsap.to(o, { n: t.score, duration: 0.6, ease: 'power2.out', onUpdate: () => { v.textContent = Math.round(o.n); } });
    gsap.fromTo(v, { scale: 1.5 }, { scale: 1, duration: 0.7, ease: 'elastic.out(1, 0.45)' });
    gsap.fromTo(el.querySelector('.burst'), { opacity: 1, scale: 0.9 }, { opacity: 0, scale: 1.25, duration: 0.8, ease: 'power2.out' });
  }
}

LiveGFX.onState((s) => {
  const S = s.scoreboard;
  const t = document.getElementById('title');
  t.textContent = S.title; t.style.display = S.title ? '' : 'none';
  const key = S.teams.map((x) => x.id + x.name + x.color).join('|');
  if (key !== structKey) { structKey = key; build(S.teams); } else update(S.teams);

  if (S.visible && !visible) {
    visible = true;
    gsap.killTweensOf(sb);
    gsap.set(sb, { visibility: 'visible' });
    gsap.timeline()
      .fromTo(sb, { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: 'power4.out' })
      .from('.team', { scaleX: 0, opacity: 0, stagger: 0.08, duration: 0.45, ease: 'power3.out' }, '-=0.35');
  } else if (!S.visible && visible) {
    visible = false;
    gsap.killTweensOf(sb);
    gsap.to(sb, { y: -160, opacity: 0, duration: 0.5, ease: 'power3.in', onComplete: () => gsap.set(sb, { visibility: 'hidden' }) });
  }
});
</script>
</body>
</html>
